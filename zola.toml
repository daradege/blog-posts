base_url = "https://blog.daradege.top"
title = "وبلاگ علی صفامنش"
description = "یه ذره از همه چیز، بیشتر از کامپیوترها"
author = "daradege"
default_language = "fa"
taxonomies = [
    { name = "tags", rss = true, paginate_by = 5 },
]
generate_feeds = false
build_search_index = false
generate_sitemap = false
generate_robots_txt = false

[markdown]
github_alerts = true
insert_anchor_links = "heading"
render_emoji = false
smart_punctuation = false
bottom_footnotes = false
external_links_target_blank = false

[markdown.highlighting]
style = "class"
light_theme = "light-plus"
dark_theme = "dark-plus"

[extra]
math = false
mermaid = false
comment = false
side_toc = true
social_image = "icons/github.svg"
menu = [
    { name = "پروژه‌ها", url = "$BASE_URL/projects" },
    { name = "آرشیو", url = "$BASE_URL/archive" },
    { name = "بیشتر", url = "$BASE_URL/more" },
    { name = "درباره", url = "$BASE_URL/about" },
]

[extra.style]

[extra.profile]
name = "علی صفامنش"
bio = "یه ذره از همه چیز، بیشتر از کامپیوترها"
avatar_url = "daradege.jpg"
avatar_invert = false
social = [
    { name = "github", url = "https://github.com/daradege" },
    { name = "tuta", url = "mailto:safamanesh@tuta.io" },
    { name = "rss", url = "$BASE_URL/atom.xml" },
]

[extra.footer]
since = 2020
license = "CC BY-SA 4.0"
license_url = "https://creativecommons.org/licenses/by-sa/4.0/deed"

[extra.giscus]
mapping = "pathname"
strict = 1
reactions_enabled = 0
emit_metadata = 0
input_position = "top"
theme = "light"
lang = "en"
loading = "lazy"
